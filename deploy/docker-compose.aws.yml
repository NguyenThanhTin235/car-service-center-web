x-app-logging: &app-logging
  driver: awslogs
  options:
    awslogs-region: ${AWS_REGION:-ap-southeast-1}
    awslogs-group: /car-service/${ENV_NAME:-prod}/app
    awslogs-create-group: "false"
    tag: "{{.Name}}"
    mode: non-blocking
    max-buffer-size: 4m

x-nginx-logging: &nginx-logging
  driver: awslogs
  options:
    awslogs-region: ${AWS_REGION:-ap-southeast-1}
    awslogs-group: /car-service/nginx
    awslogs-create-group: "false"
    tag: "{{.Name}}"
    mode: non-blocking
    max-buffer-size: 4m

services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    mem_limit: 192m
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "144mb", "--maxmemory-policy", "volatile-lru"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging: *app-logging

  backend:
    image: ${ECR_REGISTRY:-localhost}/car-service/backend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    mem_limit: 640m
    ports:
      - "${BACKEND_PORT:-5000}:5000"
    env_file:
      - path: ${ENV_FILE:-.env.runtime}
        required: false
    environment:
      NODE_ENV: production
      PORT: 5000
      REDIS_URL: redis://redis:6379
      NODE_OPTIONS: "--max-old-space-size=448"
    command: ["node", "dist/src/server.js"]
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:5000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 25s
    logging: *app-logging

  customer-web:
    image: ${ECR_REGISTRY:-localhost}/car-service/customer-web:${IMAGE_TAG:-latest}
    restart: unless-stopped
    mem_limit: 384m
    ports:
      - "${CUSTOMER_PORT:-3000}:3000"
    env_file:
      - path: ${ENV_FILE:-.env.runtime}
        required: false
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
      NODE_OPTIONS: "--max-old-space-size=256"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.status<500?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    depends_on:
      backend:
        condition: service_healthy
    logging: *app-logging

  internal-web:
    image: ${ECR_REGISTRY:-localhost}/car-service/internal-web:${IMAGE_TAG:-latest}
    restart: unless-stopped
    mem_limit: 384m
    ports:
      - "${INTERNAL_PORT:-3001}:3001"
    env_file:
      - path: ${ENV_FILE:-.env.runtime}
        required: false
    environment:
      NODE_ENV: production
      PORT: 3001
      HOSTNAME: 0.0.0.0
      NODE_OPTIONS: "--max-old-space-size=256"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/').then(r=>process.exit(r.status<500?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    depends_on:
      backend:
        condition: service_healthy
    logging: *app-logging

  nginx:
    image: nginx:1.27-alpine
    profiles: ["proxy"]
    restart: unless-stopped
    mem_limit: 128m
    ports:
      - "80:80"
      - "443:443"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      DOMAIN_NAME: ${DOMAIN_NAME:-carservice.id.vn}
      CERT_DOMAIN: ${CERT_DOMAIN:-${DOMAIN_NAME:-carservice.id.vn}}
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/templates:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot:ro
    depends_on:
      backend:
        condition: service_healthy
      customer-web:
        condition: service_healthy
      internal-web:
        condition: service_healthy
    logging: *nginx-logging

volumes:
  redis_data:
