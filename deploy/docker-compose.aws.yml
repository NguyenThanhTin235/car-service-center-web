x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging: *default-logging

  backend:
    image: ${ECR_REGISTRY:-localhost}/car-service/backend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${BACKEND_PORT:-5000}:5000"
    env_file:
      - path: ${ENV_FILE:-.env.runtime}
        required: false
    environment:
      NODE_ENV: production
      PORT: 5000
      REDIS_URL: redis://redis:6379
    command: ["sh", "-c", "node ./node_modules/prisma/build/index.js migrate deploy && node dist/src/server.js"]
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:5000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 25s
    logging: *default-logging

  customer-web:
    image: ${ECR_REGISTRY:-localhost}/car-service/customer-web:${IMAGE_TAG:-latest}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${CUSTOMER_PORT:-3000}:3000"
    env_file:
      - path: ${ENV_FILE:-.env.runtime}
        required: false
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
    depends_on:
      backend:
        condition: service_healthy
    logging: *default-logging

  internal-web:
    image: ${ECR_REGISTRY:-localhost}/car-service/internal-web:${IMAGE_TAG:-latest}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${INTERNAL_PORT:-3001}:3001"
    env_file:
      - path: ${ENV_FILE:-.env.runtime}
        required: false
    environment:
      NODE_ENV: production
      PORT: 3001
      HOSTNAME: 0.0.0.0
    depends_on:
      backend:
        condition: service_healthy
    logging: *default-logging

  nginx:
    image: nginx:1.27-alpine
    profiles: ["proxy"]
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      DOMAIN_NAME: ${DOMAIN_NAME:-carservice.id.vn}
      CERT_DOMAIN: ${CERT_DOMAIN:-${DOMAIN_NAME:-carservice.id.vn}}
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/templates:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot:ro
    depends_on:
      backend:
        condition: service_healthy
      customer-web:
        condition: service_started
      internal-web:
        condition: service_started
    logging: *default-logging

volumes:
  redis_data:
