name: CI Pipeline

on:
  pull_request:
    branches:
      - develop
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ===========================================================================
  # Stage 1: Build (Backend & Frontend in parallel)
  # ===========================================================================
  build-backend:
    name: Stage 1 - Build Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/backend
    env:
      DATABASE_URL: "mysql://ci_user:ci_pass@localhost:3306/car_service_center"
      JWT_SECRET: "ci_jwt_secret_key_123456789"
      NODE_ENV: test

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: src/backend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Generate Prisma Client & Build
        run: npx prisma generate && npm run build

  build-frontend:
    name: Stage 1 - Build Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/frontend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json

      - name: Install Monorepo Dependencies
        run: npm ci

      - name: Setup Next.js Build Cache (Customer Web)
        uses: actions/cache@v4
        with:
          path: src/frontend/apps/customer-web/.next/cache
          key: ${{ runner.os }}-nextjs-customer-${{ hashFiles('src/frontend/package-lock.json', 'src/frontend/apps/customer-web/**/*.{js,jsx,ts,tsx}') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-customer-

      - name: Setup Next.js Build Cache (Internal Web)
        uses: actions/cache@v4
        with:
          path: src/frontend/apps/internal-web/.next/cache
          key: ${{ runner.os }}-nextjs-internal-${{ hashFiles('src/frontend/package-lock.json', 'src/frontend/apps/internal-web/**/*.{js,jsx,ts,tsx}') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-internal-

      - name: Build All Frontend Workspaces
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
          NODE_ENV: production
          NEXT_PUBLIC_API_URL: "http://localhost:5000"
          NEXT_PUBLIC_INTERNAL_URL: "http://localhost:3001"
          NEXT_PUBLIC_CUSTOMER_URL: "http://localhost:3000"

  # ===========================================================================
  # Stage 2: Lint & Static Analysis (Backend & Frontend in parallel)
  # ===========================================================================
  lint-static-backend:
    name: Stage 2 - Lint & Static Analysis (Backend)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/backend
    env:
      DATABASE_URL: "mysql://ci_user:ci_pass@localhost:3306/car_service_center"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: src/backend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Validate Prisma Schema & Generate Client
        run: npx prisma validate && npx prisma generate

      - name: TypeScript Typecheck
        run: npm run typecheck

      - name: ESLint
        run: npm run lint

  lint-static-frontend:
    name: Stage 2 - Lint & Static Analysis (Frontend)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/frontend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json

      - name: Install Monorepo Dependencies
        run: npm ci

      - name: ESLint All Workspaces
        run: npm run lint

      - name: Next Typegen & Typecheck (Customer Web)
        working-directory: src/frontend/apps/customer-web
        run: npx next typegen && npx tsc --noEmit

      - name: Next Typegen & Typecheck (Internal Web)
        working-directory: src/frontend/apps/internal-web
        run: npx next typegen && npx tsc --noEmit

  # ===========================================================================
  # Stage 3: Automated Tests
  # ===========================================================================
  test-backend:
    name: Stage 3 - Automated Tests (Backend)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/backend
    env:
      DATABASE_URL: "mysql://ci_user:ci_pass@localhost:3306/car_service_center"
      JWT_SECRET: "ci_jwt_secret_key_123456789"
      PORT: 5000
      NODE_ENV: test

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: src/backend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run Unit Tests (Vitest)
        run: npm test

  test-frontend-infra:
    name: Stage 3 - Automated Tests (Frontend Unit & AWS CDK)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json

      - name: Run Customer Web Unit Tests
        working-directory: src/frontend
        run: npm ci && npm run test:unit:customer

      - name: Run AWS CDK Infrastructure Tests
        working-directory: infra
        run: npm ci && npm run typecheck && npm test

  # ===========================================================================
  # Stage 4: Security & Dependency Scan
  # ===========================================================================
  security-scan:
    name: Stage 4 - Security & Dependency Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout Code (Full History for Gitleaks)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: NPM Audit (Backend)
        working-directory: src/backend
        continue-on-error: true
        run: npm audit --audit-level=high

      - name: NPM Audit (Frontend)
        working-directory: src/frontend
        continue-on-error: true
        run: npm audit --audit-level=high

      - name: Trivy Filesystem Vulnerability Scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: "fs"
          scan-ref: "."
          format: "table"
          ignore-unfixed: true
          severity: "CRITICAL,HIGH"
          exit-code: "0"

      - name: Gitleaks Secret Scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_SUMMARY: true
