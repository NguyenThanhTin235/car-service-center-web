name: CI Pipeline

on:
  push:
    branches:
      - develop
      - main
  pull_request:
    branches:
      - develop
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-ci:
    name: Backend CI (Test, Validate & Build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/backend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: src/backend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Validate Prisma Schema
        run: npx prisma validate

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: TypeScript Build & Typecheck
        run: npm run build

      - name: Run Unit Tests (Vitest)
        run: npm test

  frontend-ci:
    name: Frontend CI (Lint, Typecheck & Next.js Build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/frontend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json

      - name: Install Monorepo Dependencies
        run: npm ci

      - name: Setup Next.js Build Cache (Customer Web)
        uses: actions/cache@v4
        with:
          path: src/frontend/apps/customer-web/.next/cache
          key: ${{ runner.os }}-nextjs-customer-${{ hashFiles('src/frontend/package-lock.json', 'src/frontend/apps/customer-web/**/*.{js,jsx,ts,tsx}') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-customer-

      - name: Setup Next.js Build Cache (Internal Web)
        uses: actions/cache@v4
        with:
          path: src/frontend/apps/internal-web/.next/cache
          key: ${{ runner.os }}-nextjs-internal-${{ hashFiles('src/frontend/package-lock.json', 'src/frontend/apps/internal-web/**/*.{js,jsx,ts,tsx}') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-internal-

      - name: Build All Frontend Workspaces
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
          NODE_ENV: production
